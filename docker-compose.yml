networks:
  medlink:
    name: medlink

volumes:
  postgres_data:
    name: medlink

services:
  postgres:
    image: postgres
    restart: unless-stopped
    container_name: postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - medlink
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    image: medlink-api
    container_name: medlink-api
    volumes:
      - .:/app
    networks:
      - medlink
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - PORT=8888
    depends_on:
      - postgres